<!DOCTYPE html>

    <body>
        <h2>JavaScript Learning</h2>

        <script>
            console.log("Hello, World!")

            function add7(n){
                return n + 7;
            }

            function mulitply(a, b){
                return a * b;
            }

            function capitalize(str){
                str = str.toLowerCase();
                return str[0].toUpperCase() + str.slice(1);
            }

            function lastLetter(str){
                return str[str.length - 1];
            }

        </script>
